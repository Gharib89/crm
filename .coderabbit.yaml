# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Path instructions derive from the canonical standards doc,
# docs/contributing/coding-standards.md (wayfinder tickets #825/#827) — rule
# changes land there first, then re-derive here.

tone_instructions: >-
  Direct and concise; no praise, no restating the diff. Comment only when
  confident an issue is real, citing the exact line. Prioritize correctness,
  error contracts, and cross-platform safety over style.

reviews:
  # chill (balanced) during the Copilot-coexistence trial: quiet would starve
  # the comparison data the Copilot-fate decision (#833) needs.
  profile: chill
  path_filters:
    # Generated by python-semantic-release at release time; never hand-edited.
    - "!CHANGELOG.md"
  auto_review:
    # Defaults, spelled out because the agent PR lifecycle depends on them:
    # agents open ready (non-draft) PRs against main; drafts skip automatic
    # reviews (manual @coderabbitai review still works).
    # Agent-authored PRs are deliberately NOT filtered (no ignore_usernames) —
    # reviewing them is the point of the trial.
    enabled: true
    drafts: false
  path_instructions:
    - path: "**"
      instructions: >-
        Python CLI for Microsoft Dynamics 365 CE — on-prem v9.x (NTLM) and
        Dataverse online (OAuth) — over the Dataverse Web API (OData v4).
        Canonical coding standards live in
        docs/contributing/coding-standards.md; these instructions derive from
        that doc and it wins on conflict. Focus on correctness, error
        handling, and contract violations. CI already runs pytest, pyright
        (strict on crm/core/* and crm/utils/d365_backend.py), and mkdocs
        build --strict — do not flag issues those tools catch, and skip
        stylistic nits. Cross-cutting rules: every file read pins an explicit
        encoding — utf-8-sig for user-authored inputs (CSV, JSONL, specs),
        utf-8 for writes — and subprocess captures pin encoding="utf-8",
        errors="replace"; Unix-only imports (fcntl, pwd, termios, …) need
        try/except ImportError at the import line; never `assert` for a
        runtime invariant in shipped code (stripped under python -O) — raise
        D365Error instead; docstrings are Google style (Args:/Returns:/
        Raises:) with no coverage quota — don't request docstrings on
        self-explanatory helpers; new lazily-loaded command groups must be
        added to crm.spec hiddenimports (PyInstaller). The repo is public and
        must stay generic: flag real org names, internal hostnames, or
        real-looking GUIDs in tests/docs (placeholders are Contoso /
        internalcrm.contoso.local). Every new/changed command or flag ships
        docs in the same PR (docs/how-to/<group>.md, docs/reference/cli.md,
        README.md if user-facing, crm/skills/ if workflow-visible); never
        hand-edit CHANGELOG.md — python-semantic-release generates it.
    - path: "crm/commands/**"
      instructions: >-
        Thin Click wrappers over crm/core. Wrap file read/write in try/except
        OSError and return a clean error envelope; mutually exclusive flags
        must raise click.UsageError (exit 2), never ctx.emit(False) (exit 1);
        validate untrusted input before calling ctx.backend(). Backend
        failures funnel through the d365_errors(ctx) context manager, never a
        bare try/except D365Error that hand-builds the envelope. Exit-code
        contract (ADR 0001): 0 success, 1 operational failure, 2 usage error
        — failure-class detail lives in the envelope, not new exit codes.
        CLIContext.emit(meta=...) renders in HUMAN mode too — JSON-only meta
        fields must be gated on ctx.json_mode. When serializing Click
        options, include opt.secondary_opts (the --no-* forms), not just
        opt.opts. The `# pyright: basic` header on command files is permanent
        by design — don't suggest tightening the wrapper; real logic moves to
        crm/core/* instead. Credentials come only from saved profiles or
        --password, never env vars.
    - path: "crm/core/**"
      instructions: >-
        Web API logic; pyright strict. Output contract (ADR 0008): the data
        payload is curated and CLI-owned, never a raw Web API passthrough —
        OData paging keys relocate to meta, and _entity_id is the one
        normalized GUID key. Keep dict[str, Any] at the raw OData response
        seam — don't suggest TypedDict casts over external JSON; TypedDict is
        reserved for structures the CLI constructs and owns. Dry-run mutators
        must return a {_dry_run, would_*} preview, never the bare success key
        — backend.request short-circuits ALL methods including pre-flight
        GETs in dry-run, so existence checks silently no-op; plain reads
        still execute live under --dry-run (reads-execute rule). Logic
        enforcing header invariants ("never emit both X and Y") must use
        requests' CaseInsensitiveDict, not a plain dict. @odata.bind
        navigation-property names must match $metadata casing — system
        entities (sdkmessage*, solution, …) use lowercase logical names; flag
        guessed PascalCase. D365Backend retries only 502/503/504 (+429) for
        idempotent methods, NOT all 5xx — do not flag the no-retry path for a
        bare 500 as a bug.
    - path: "crm/tests/**"
      instructions: >-
        Known non-issues — do not flag: tests using a bare 500 to exercise
        the no-retry path are intentional and fast; Click is pinned ≥8.2, so
        CliRunner has no mix_stderr parameter and stdout/stderr are always
        separate; "# pyright: basic" headers in test files are intentional
        (only crm/core/* and crm/utils/d365_backend.py are strict). Tests
        must use generic placeholders (Contoso / internalcrm.contoso.local),
        never real org names, hostnames, or GUIDs.
    - path: ".claude/skills/**"
      instructions: >-
        Two kinds of skill live here. Project-native ones (ship, cloud-ship,
        merge-gate, live-e2e) are hand-edited in this repo — review normally.
        The rest are vendored copies synced verbatim by
        scripts/sync-skills.py and must never be hand-edited — do not request
        content changes on them; a sync PR replacing them wholesale is
        expected and mechanical.
