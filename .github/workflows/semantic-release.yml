name: semantic-release

# On every push to main, python-semantic-release reads the Conventional Commit
# history since the last tag, bumps the version in setup.py + crm/__init__.py,
# updates CHANGELOG.md, commits "chore(release): vX.Y.Z", and tags vX.Y.Z.
#
# It does NOT build or create the GitHub release (vcs_release: false): the tag
# push triggers the existing release.yml, which builds the PyInstaller binaries,
# uploads to R2, and creates the GitHub release.
#
# Why a deploy key and not GITHUB_TOKEN or an owner token: a tag pushed with
# the default GITHUB_TOKEN does NOT trigger other workflows (GitHub
# anti-recursion rule), so release.yml would never fire; a deploy-key push does.
# And the owner's token (the old RELEASE_PAT) bypassed the main ruleset on every
# push through the admin role. RELEASE_DEPLOY_KEY is the private half of a write
# deploy key, and `DeployKey` is the bypass actor of the main ruleset and of the
# tag ruleset, so only this workflow's push skips them.
#
# PSR runs as the CLI on the runner, not as its Docker action: the action
# exports github_token as GH_TOKEN and PSR then rebuilds an HTTPS remote from
# it, and the container could not see the checkout's SSH config. With no token
# in the environment and `ignore_token_for_push = true` (pyproject.toml), PSR
# pushes to the origin remote the checkout set up over SSH.
# No RELEASE_PAT is left: nothing here calls the API (vcs_release is off).

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    # PSR's own "chore(release): vX.Y.Z" commit is pushed back to main (with the
    # PAT, so it re-triggers this workflow). On that commit there is nothing left
    # to release, so skip the no-op re-run. NOT [skip ci] in commit_message: the
    # tag points at this commit, so [skip ci] would also suppress release.yml.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout (full history for version evaluation)
        uses: actions/checkout@v6  # zizmor: ignore[artipacked] the push in the next step needs the persisted SSH config; only the deploy key is stored, no token
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # The deploy key sets origin to git@github.com and the SSH config PSR's
          # push needs, so the credentials stay persisted for the next step.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Force branch to the workflow sha
        run: git reset --hard ${{ github.sha }}

      - name: Python Semantic Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pipx run --spec python-semantic-release==10.5.3 semantic-release version --no-vcs-release --skip-build
