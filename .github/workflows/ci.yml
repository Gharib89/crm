name: ci

# Heads-up: a NEW workflow file does not trigger on the PR that introduces it —
# GitHub only runs pull_request workflows already present on the default branch.
# So this file is first exercised on the FIRST pull_request opened AFTER it lands
# on main; the introducing PR (#344/#345) validated it via the local gate instead.
#
# PR-only gate. The PR is the single enforced gate (a ruleset on main requires
# these jobs + blocks direct pushes), so push:main does NOT rebuild — binaries
# build exactly once, at the release tag (release.yml). See
# docs/adr/0010-build-once-trust-pr-pipeline.md.
on:
  pull_request:
    branches: [main]

# Cancel a superseded PR run when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pyright is OS-independent — run it once, not per-OS.
  lint:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: setup.py
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Lint + format ride the existing required `lint` job — a new job would
      # need a ruleset (required-checks) update to be enforced.
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (pyright)
        run: pyright
      # House-convention rules (Semgrep CE, LGPL-2.1). The engine needs Python
      # >=3.10 and is deliberately kept OUT of the dev venv (issue #849) —
      # install it into its own throwaway venv. Tokenless: `scan` (not `ci`)
      # needs no SEMGREP_APP_TOKEN / account. Rule scope is pinned in the config.
      - name: House-convention rules (semgrep)
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep==1.169.0
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config ci/semgrep-rules.yml --error --metrics off
      # Lint workflow YAML + the inline bash in `run:` blocks (shellcheck-backed).
      # Download the pinned release binary rather than a marketplace action so
      # nothing new needs auditing; the SHA256 pins the exact bytes (a version
      # tag alone is mutable). Version is kept in lockstep with the actionlint
      # pre-commit hook rev — bump the version, URL, and checksum together.
      # actionlint auto-discovers .github/workflows.
      - name: Lint workflows (actionlint)
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      # GitHub Actions security audit. zizmor is a pre-compiled binary wheel on
      # PyPI; install it into its own throwaway venv (like semgrep) so it stays
      # out of the dev venv. The version is kept in lockstep with the zizmor
      # pre-commit hook rev — bump both together. Config: .github/zizmor.yml
      # (auto-discovered); the `.` arg scans the repo tree for workflows.
      - name: Audit workflows (zizmor)
        run: |
          python -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet zizmor==1.26.1
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" .

  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: setup.py
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Coverage is REPORT-ONLY: no --cov-fail-under, no threshold gate, no
      # Codecov (map #819). --cov stays out of addopts so local `pytest` runs
      # fast; CI passes the flags explicitly and uploads the report as an artifact.
      - name: Run unit tests
        run: pytest -q --cov=crm --cov-report=xml --cov-report=html
      - name: Upload coverage report
        # One artifact from Linux is enough for a report-only signal.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
      # The solution pack/extract verbs are offline local-file transforms (they
      # shell out to the Power Platform CLI, never to a D365 org), so their live
      # e2e runs here on every push with no org/creds/VPN — unlike the secret-gated
      # live-org legs. pac >= 2.8 targets .NET 10, so pin that runtime explicitly.
      - name: Install .NET (for pac)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Power Platform CLI (pac)
        shell: bash
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Run offline solution pack/extract e2e
        shell: bash
        run: |
          # Fail loudly if provisioning regressed: the test skips when pac is
          # absent (good for local runs), so without this guard a broken install
          # would skip both tests and the step would still go green — testing
          # nothing. `pac help` exits 0 only when pac actually runs.
          pac help >/dev/null || { echo "::error::pac not runnable on PATH — provisioning failed"; exit 1; }
          pytest -q -m e2e crm/tests/e2e/test_solution_packager_e2e.py

  # Pre-merge packaging gate: catch broken crm.spec / missing hiddenimports
  # before the release tag, since release.yml is the only other PyInstaller run
  # and a failure there happens after the tag is already pushed.
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: setup.py
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build with PyInstaller
        run: pyinstaller crm.spec
      - name: Smoke test (Linux)
        if: runner.os != 'Windows'
        run: |
          ./dist/crm/crm --version
          ./dist/crm/crm --help
          # Prove the bundled jq C-extension loads and shapes output. profile
          # list is fully offline (no live org); --json/--jq/--fields are global
          # opts placed before the command.
          ./dist/crm/crm --json --jq 'length' profile list
          ./dist/crm/crm --json --fields name profile list
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        # PowerShell (backslash paths) — declare it so actionlint doesn't lint the
        # block as bash (shellcheck reads `.\crm.exe` escapes as SC1001).
        shell: pwsh
        run: |
          .\dist\crm\crm.exe --version
          .\dist\crm\crm.exe --help
          .\dist\crm\crm.exe --json --jq 'length' profile list
          .\dist\crm\crm.exe --json --fields name profile list
