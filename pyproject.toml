# Tool config only (python-semantic-release, ruff, pytest). Intentionally NO
# [build-system] table:
# the project is still built from setup.py (setuptools legacy backend), and the
# release pipeline (.github/workflows/release.yml, crm.spec) is unchanged.
[tool.semantic_release]
# Bump both version sites on every release (see CLAUDE.md "Release").
version_variables = [
    "crm/__init__.py:__version__",
    "setup.py:version",
]
# Graduated to 1.0 (#130). With allow_zero_version=false PSR forces the next
# release (driven by this milestone's feat: commits) to 1.0.0, and normal semver
# resumes thereafter (breaking → major). major_on_zero is moot once >= 1.0.
allow_zero_version = false
major_on_zero = true
# release.yml owns the binary build; PSR must not build.
build_command = ""
commit_message = "chore(release): v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.changelog]
mode = "update"

# Formatting & linting — the agreed shape is documented in
# docs/contributing/coding-standards.md ("Formatting & linting"); this table is
# the executable source of truth for the exact codes.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# D2xx/D4xx docstring FORMAT only — deliberately no D1xx (missing-docstring),
# S (bandit), C90 (complexity), or ANN (pyright owns typing).
select = ["E", "W", "F", "I", "B", "UP", "D2", "D4"]
# D205 (blank line between summary and description) is permanently excluded, not
# adoption debt: it counts only physical line 1 as the summary, so it forces every
# multi-line summary onto one line — which then trips E501 as breakable prose (>100
# chars, unlike the exempt URL/box-rule lines). 482 of 569 sites cannot satisfy
# D205 + E501 without rewording, and the descriptive-first-line convention here is
# deliberate. See #843.
ignore = ["D205"]

[tool.ruff.lint.per-file-ignores]
# Tests import mid-file deliberately (after env/path setup in conftest, or to
# order fixtures); scoped ignore per the standards doc, never a global removal.
"crm/tests/**" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
# Typo checker wired as a pre-commit hook ONLY, deliberately NOT a CI gate (#848):
# a jargon false positive must never block a merge. Run: `pre-commit run codespell`.
# Skip generated/vendored/binary trees (incl. the mkdocs `site/` build output),
# the PSR-owned CHANGELOG, research build artifacts, and the test suites (which
# carry intentional-misspelling fixtures: did-you-mean tests feed deliberately
# mistyped entity names on purpose). Directory/path entries keep the `./` prefix:
# codespell prunes a dir by fnmatch-ing its walked path (`./crm/tests`), so a bare
# `crm/tests` would NOT match. Basename globs (`*.svg`) match without it.
skip = "./.git,./.venv,./site,./htmlcov,./dist,./build,CHANGELOG.md,*.lock,*.min.js,*.svg,./crm/tests,./evals,./docs/research/*.html,./docs/research/*.json"
# D365 / project jargon, proper nouns, verbatim external quotes, and house
# spelling variants — none are typos:
#   bu = Business Unit · datas = PyInstaller .spec API · unsecure = D365 plug-in
#   config term · pres = presentationdescription variable · nam/oce = D365
#   datacenter region codes · shotcut = Shotcut editor (example app name) ·
#   compatability = verbatim quote of the fetch.xsd enum comment. The hyphenated
#   pre-*/re-* forms are the repo's consistent house style, not misspellings.
ignore-words-list = "bu,datas,unsecure,pres,unparseable,appliable,invokable,nam,oce,shotcut,compatability,pre-emptively,pre-empted,pre-empt,pre-selected,re-use,re-uses,re-declare"

[tool.pytest.ini_options]
testpaths = ["crm/tests"]
markers = [
    "e2e: live test requiring a reachable D365 server (opt-in via D365_E2E=1)",
    "requires_cloud: only runs against an OAuth/Dataverse target",
    "requires_onprem: only runs against an NTLM/on-prem target",
    "offline: e2e that needs only a local binary (no D365 org/creds), so it runs in plain CI",
    "slow: long-running op (metadata publish, solution async import/export)",
]
addopts = "-m 'not e2e'"
